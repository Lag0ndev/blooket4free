<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blooket4Free | Market</title>
    <link rel="icon" type="image/x-icon" href="./assets/misc_images/favicon.ico">
    <link rel="stylesheet" href="./assets/css/styles.css">
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;700&family=Titan+One&display=swap" rel="stylesheet">
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/phaser@3.55.2/dist/phaser.min.js"></script>

    <style>
        /* Clean overrides so the page works offline / standalone */
        body, html {
            margin: 0;
            padding: 0;
            height: 100%;
            width: 100%;
            overflow-x: hidden;
            background: #0bc2cf;
            font-family: 'Nunito', sans-serif;
        }

        #sidebar {
            position: fixed;
            top: 0;
            left: 0;
            height: 100%;
            width: 280px;
            z-index: 1005;
            background: #6b2eb3;
            border-right: 6px solid rgba(255,255,255,0.25);
            display: flex;
            flex-direction: column;
            align-items: center;
            padding-top: 20px;
        }

        .Sidebar_logoDesktop__NeFcd {
            width: 70% !important;
            margin-bottom: 30px !important;
        }

        .Sidebar_list__ljw79 {
            list-style: none;
            padding: 0;
            width: 100%;
        }

        .Sidebar_link__pbkfx {
            display: flex;
            align-items: center;
            gap: 14px;
            padding: 14px 24px;
            color: white;
            text-decoration: none;
            font-family: 'Titan One', cursive;
            font-size: 20px;
            transition: 0.15s;
        }

        .Sidebar_link__pbkfx:hover {
            background: rgba(255,255,255,0.15);
        }

        .Sidebar_listIcon__rg5X6 svg {
            width: 26px;
            height: 26px;
            fill: white;
        }

        .scrollWrapper {
            margin-left: 300px;
            width: calc(100% - 300px);
            min-height: 100vh;
            padding: 30px 20px 60px;
            box-sizing: border-box;
        }

        .title {
            font-family: 'Titan One', cursive;
            font-size: clamp(32px, 5vw, 56px);
            color: white;
            text-align: center;
            text-shadow: 4px 4px rgba(0,0,0,0.25);
            margin-bottom: 40px;
        }

        .packContainer {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 28px;
            justify-content: center;
            max-width: 1200px;
            margin: 0 auto;
        }

        .packWrapper {
            position: relative;
            width: 200px;
            height: 200px;
            margin: 0 auto;
        }

        .pack {
            width: 100%;
            height: 100%;
            border-radius: 12px;
            overflow: hidden;
            cursor: pointer;
            box-shadow: inset 0 -8px rgba(0,0,0,0.2), 4px 4px rgba(0,0,0,0.2);
            transition: transform 0.2s;
            position: relative;
        }

        .pack:hover {
            transform: scale(0.96);
        }

        .pngContainer {
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            transform: rotate(8deg);
        }

        .pngMain {
            width: 70%;
            max-height: 80%;
            object-fit: contain;
        }

        .custom-pack-badge {
            position: absolute;
            top: 8px;
            left: 8px;
            background: #0bc2cf;
            color: white;
            padding: 3px 8px;
            border-radius: 6px;
            font-size: 11px;
            font-family: 'Titan One', cursive;
            z-index: 5;
        }

        .delete-pack-btn {
            position: absolute;
            top: 8px;
            right: 8px;
            width: 26px;
            height: 26px;
            border-radius: 50%;
            background: #ff4757;
            color: white;
            font-weight: bold;
            display: none;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            z-index: 10;
        }

        .packWrapper:hover .delete-pack-btn {
            display: flex;
        }

        .uploadBtn {
            display: block;
            margin: 30px auto 0;
            background: #6b2eb3;
            color: white;
            border: none;
            border-radius: 12px;
            padding: 14px 28px;
            font-family: 'Titan One', cursive;
            font-size: 20px;
            cursor: pointer;
            box-shadow: inset 0 -5px rgba(0,0,0,0.2), 4px 4px rgba(0,0,0,0.2);
            transition: transform 0.15s;
        }

        .uploadBtn:hover {
            transform: scale(0.97);
        }

        @media (max-width: 700px) {
            #sidebar { display: none; }
            .scrollWrapper { margin-left: 0; width: 100%; }
        }
    </style>
</head>
<body>

    <!-- Sidebar -->
    <nav id="sidebar">
        <img class="Sidebar_logoDesktop__NeFcd" src="./assets/misc_images/logo.png" alt="Blooket4Free">
        <ul class="Sidebar_list__ljw79">
            <li>
                <a class="Sidebar_link__pbkfx" href="./blooks.html">
                    <span class="Sidebar_listIcon__rg5X6">
                        <svg viewBox="0 0 512 512"><path d="M128 480h256V80c0-26.5-21.5-48-48-48H176c-26.5 0-48 21.5-48 48v400zm64-384h128v32H192V96zm320 80v256c0 26.5-21.5 48-48 48h-48V128h48c26.5 0 48 21.5 48 48zM96 480H48c-26.5 0-48-21.5-48-48V176c0-26.5 21.5-48 48-48h48v352z"/></svg>
                    </span>
                    <span>Blooks</span>
                </a>
            </li>
            <li>
                <a class="Sidebar_link__pbkfx" href="./">
                    <span class="Sidebar_listIcon__rg5X6">
                        <svg viewBox="0 0 616 512"><path d="M602 118.6L537.1 15C531.3 5.7 521 0 510 0H106C95 0 84.7 5.7 78.9 15L14 118.6c-33.5 53.5-3.8 127.9 58.8 136.4 4.5.6 9.1.9 13.7.9 29.6 0 55.8-13 73.8-33.1 18 20.1 44.3 33.1 73.8 33.1 29.6 0 55.8-13 73.8-33.1 18 20.1 44.3 33.1 73.8 33.1 4.7 0 9.2-.3 13.7-.9 62.8-8.4 92.6-82.8 59-136.4zM529.5 288c-10 0-19.9-1.5-29.5-3.8V384H116v-99.8c-9.6 2.2-19.5 3.8-29.5 3.8-6 0-12.1-.4-18-1.2-5.6-.8-11.1-2.1-16.4-3.6V480c0 17.7 14.3 32 32 32h448c17.7 0 32-14.3 32-32V283.2c-5.4 1.6-10.8 2.9-16.4 3.6-6.1.8-12.1 1.2-18.2 1.2z"/></svg>
                    </span>
                    <span>Market</span>
                </a>
            </li>
            <li>
                <a class="Sidebar_link__pbkfx" href="./maker.html">
                    <span class="Sidebar_listIcon__rg5X6">
                        <svg viewBox="0 0 512 512"><path d="M495.9 166.6c3.2 8.7 .5 18.4-6.4 24.6l-43.3 39.4c1.1 8.3 1.7 16.8 1.7 25.4s-.6 17.1-1.7 25.4l43.3 39.4c6.9 6.2 9.6 15.9 6.4 24.6c-4.4 11.9-9.7 23.3-15.8 34.3l-4.7 8.1c-6.6 11-14 21.4-22.1 31.2c-5.9 7.2-15.7 9.6-24.5 6.8l-55.7-17.7c-13.4 10.3-28.2 18.9-44 25.4l-12.5 57.1c-2 9.1-9 16.3-18.2 17.8c-13.8 2.3-28 3.5-42.5 3.5s-28.7-1.2-42.5-3.5c-9.2-1.5-16.2-8.7-18.2-17.8l-12.5-57.1c-15.8-6.5-30.6-15.1-44-25.4L83.1 425.9c-8.8 2.8-18.6 .3-24.5-6.8c-8.1-9.8-15.5-20.2-22.1-31.2l-4.7-8.1c-6.1-11-11.4-22.4-15.8-34.3c-3.2-8.7-.5-18.4 6.4-24.6l43.3-39.4C64.6 273.1 64 264.6 64 256s.6-17.1 1.7-25.4L22.4 191.2c-6.9-6.2-9.6-15.9-6.4-24.6c4.4-11.9 9.7-23.3 15.8-34.3l4.7-8.1c6.6-11 14-21.4 22.1-31.2c5.9-7.2 15.7-9.6 24.5-6.8l55.7 17.7c13.4-10.3 28.2-18.9 44-25.4l12.5-57.1c2-9.1 9-16.3 18.2-17.8C227.3 1.2 241.5 0 256 0s28.7 1.2 42.5 3.5c9.2 1.5 16.2 8.7 18.2 17.8l12.5 57.1c15.8 6.5 30.6 15.1 44 25.4l55.7-17.7c8.8-2.8 18.6-.3 24.5 6.8c8.1 9.8 15.5 20.2 22.1 31.2l4.7 8.1c6.1 11 11.4 22.4 15.8 34.3zM256 336a80 80 0 1 0 0-160 80 80 0 1 0 0 160z"/></svg>
                    </span>
                    <span>Pack Maker</span>
                </a>
            </li>
        </ul>
    </nav>

    <div class="scrollWrapper">
        <div class="title">Market</div>

        <div class="packContainer" id="packContainer">
            <!-- Packs will be injected here by JS -->
        </div>

        <button class="uploadBtn" id="loadCustomBtn">Load Custom Pack</button>
        <input type="file" id="customPackInput" accept=".bpk" style="display:none">
    </div>

    <!-- Data files -->
    <script src="./assets/js/packdata.js"></script>
    <script src="./assets/js/freepackdata.js"></script>
    <script src="./assets/js/seasonalpackdata.js"></script>
    <script src="./assets/js/indexed-db.js"></script>
    <script src="./assets/js/particles.js"></script>

    <script>
        // Simple market renderer that works with the data files you already have
        async function renderPacks() {
            const container = document.getElementById('packContainer');
            container.innerHTML = '';

            // Combine all pack sources
            let allPacks = [
                ...(typeof packData !== 'undefined' ? packData : []),
                ...(typeof freePackData !== 'undefined' ? freePackData : []),
                ...(typeof seasonalPackData !== 'undefined' ? seasonalPackData : [])
            ];

            // Load any custom packs from IndexedDB
            try {
                await packDB.init();
                const customs = await packDB.loadCustomPacks();
                allPacks = allPacks.concat(customs.map(p => ({...p, isCustom: true})));
            } catch (e) {
                console.warn('IndexedDB not available', e);
            }

            allPacks.forEach((pack, idx) => {
                if (pack.comingSoon) return;

                const wrapper = document.createElement('div');
                wrapper.className = 'packWrapper';

                if (pack.isCustom) {
                    const badge = document.createElement('div');
                    badge.className = 'custom-pack-badge';
                    badge.textContent = 'CUSTOM';
                    wrapper.appendChild(badge);

                    const del = document.createElement('div');
                    del.className = 'delete-pack-btn';
                    del.innerHTML = '×';
                    del.onclick = async (e) => {
                        e.stopPropagation();
                        if (confirm('Delete this custom pack?')) {
                            await packDB.deleteCustomPack(idx - (packData.length + freePackData.length + seasonalPackData.length));
                            renderPacks();
                        }
                    };
                    wrapper.appendChild(del);
                }

                const packDiv = document.createElement('div');
                packDiv.className = 'pack';
                packDiv.style.background = Array.isArray(pack.bg) ? pack.bg[0] : pack.bg;

                const pngContainer = document.createElement('div');
                pngContainer.className = 'pngContainer';

                const img = document.createElement('img');
                img.className = 'pngMain';
                img.src = pack.png;
                img.alt = pack.name;
                img.onerror = () => { img.style.display = 'none'; };

                pngContainer.appendChild(img);
                packDiv.appendChild(pngContainer);
                wrapper.appendChild(packDiv);

                // Simple tooltip
                wrapper.title = pack.name + (pack.year ? ` (${pack.year})` : '');

                // Click → open pack (you can expand this later with the full opening animation)
                packDiv.onclick = () => {
                    alert(`Opening: ${pack.name}\n\n(This is a simplified version. Full pack-opening animation requires the original game logic.)`);
                };

                container.appendChild(wrapper);
            });
        }

        // Custom pack loader
        document.getElementById('loadCustomBtn').onclick = () => {
            document.getElementById('customPackInput').click();
        };

        document.getElementById('customPackInput').onchange = async (e) => {
            const file = e.target.files[0];
            if (!file) return;

            const text = await file.text();
            try {
                const pack = JSON.parse(text);
                await packDB.addCustomPack(pack);
                renderPacks();
                alert('Custom pack loaded!');
            } catch (err) {
                alert('Invalid .bpk file');
            }
        };

        // Start
        renderPacks();
    </script>
</body>
</html>
