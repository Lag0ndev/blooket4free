<!DOCTYPE html>
<html>
  <head>
    <title>Fastyjay</title>
    <style>
      body {
        margin: 0;
        height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        background: #111;
        overflow: hidden;
        position: relative;
      }

      .main-img {
        width: 240px;
        height: auto;
        border-radius: 16px;
        cursor: pointer;
        z-index: 10;
        transition: transform 0.15s ease;
        user-select: none;
        -webkit-user-drag: none;
      }

      .main-img:hover {
        transform: scale(1.06);
      }

      .chaos-img {
        position: fixed;
        border-radius: 12px;
        pointer-events: none;
        z-index: 100;
        will-change: transform, opacity;
      }

      @keyframes explodeOut {
        0% {
          opacity: 1;
          transform: scale(0.2) rotate(0deg);
        }
        40% {
          opacity: 1;
          transform: scale(1.3) rotate(var(--rot));
        }
        100% {
          opacity: 0;
          transform: scale(0.6) rotate(calc(var(--rot) * 3)) translate(var(--tx), var(--ty));
        }
      }

      @keyframes bounceAround {
        0% {
          opacity: 1;
          transform: scale(0.4) translate(0, 0) rotate(0deg);
        }
        25% {
          transform: scale(1.1) translate(var(--tx1), var(--ty1)) rotate(90deg);
        }
        50% {
          transform: scale(0.9) translate(var(--tx2), var(--ty2)) rotate(180deg);
        }
        75% {
          transform: scale(1.2) translate(var(--tx3), var(--ty3)) rotate(270deg);
        }
        100% {
          opacity: 0;
          transform: scale(0.3) translate(var(--tx4), var(--ty4)) rotate(360deg);
        }
      }

      @keyframes spinFall {
        0% {
          opacity: 1;
          transform: scale(1) rotate(0deg) translateY(0);
        }
        100% {
          opacity: 0;
          transform: scale(0.4) rotate(720deg) translateY(120vh);
        }
      }

      @keyframes zoomPop {
        0% {
          opacity: 1;
          transform: scale(0) rotate(-30deg);
        }
        30% {
          opacity: 1;
          transform: scale(1.4) rotate(20deg);
        }
        100% {
          opacity: 0;
          transform: scale(0.2) rotate(180deg);
        }
      }

      .shake {
        animation: shake 0.45s cubic-bezier(.36,.07,.19,.97) both;
      }

      @keyframes shake {
        0%, 100% { transform: translate(0, 0) rotate(0); }
        10% { transform: translate(-14px, -6px) rotate(-2deg); }
        20% { transform: translate(12px, 4px) rotate(2deg); }
        30% { transform: translate(-10px, 8px) rotate(-1deg); }
        40% { transform: translate(10px, -4px) rotate(1deg); }
        50% { transform: translate(-8px, 2px) rotate(-1deg); }
        60% { transform: translate(8px, -6px) rotate(1deg); }
        70% { transform: translate(-6px, 4px) rotate(0deg); }
        80% { transform: translate(6px, -2px) rotate(-1deg); }
        90% { transform: translate(-4px, 2px) rotate(0deg); }
      }

      .flash {
        position: fixed;
        inset: 0;
        pointer-events: none;
        z-index: 50;
        animation: flashOut 0.5s ease-out forwards;
      }

      @keyframes flashOut {
        0% { opacity: 0.7; }
        100% { opacity: 0; }
      }

      .ripple {
        position: fixed;
        border-radius: 50%;
        border: 3px solid rgba(92, 106, 196, 0.6);
        pointer-events: none;
        z-index: 40;
        transform: translate(-50%, -50%);
        animation: rippleExpand 0.7s ease-out forwards;
      }

      @keyframes rippleExpand {
        0% {
          width: 20px;
          height: 20px;
          opacity: 1;
        }
        100% {
          width: 600px;
          height: 600px;
          opacity: 0;
        }
      }
    </style>
  </head>
  <body>
    <img 
      src="https://cdn.phototourl.com/member/2026-11-09-3eeac61c-c554-48f8-872d-8e6f84fb79c9.png" 
      alt="" 
      class="main-img" 
      id="mainImg"
    >

    <script>
      const img = document.getElementById('mainImg');
      const body = document.body;

      // Bigger mix: real anthro furries (people with ears/tails) + weirder chaotic stuff
      const chaosImages = [
        // original
        "https://cdn.phototourl.com/member/2026-11-09-3eeac61c-c554-48f8-872d-8e6f84fb79c9.png",

        // anthro / furry characters (people with animal features)
        "https://jinxxy-c.jinxxy-cdn.com/cdn-cgi/image/format=auto,onerror=redirect/5c2e8945-f61a-5377-87fa-750bcec247ee/3466294563277112810/759733571582708736.png",
        "https://art.ngfiles.com/thumbnails/2251000/2251437_full.webp?f1640175384",
        "https://upload.wikimedia.org/wikipedia/commons/7/79/Anteater_Anthro.jpg",
        "https://i.imgur.com/vFg92Bk.jpeg",

        // more anthro style
        "https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/other/official-artwork/133.png",
        "https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/other/official-artwork/196.png",
        "https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/other/official-artwork/197.png",
        "https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/other/official-artwork/700.png",
        "https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/other/official-artwork/471.png",
        "https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/other/official-artwork/470.png",
        "https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/other/official-artwork/136.png",
        "https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/other/official-artwork/135.png",
        "https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/other/official-artwork/134.png",

        // extra chaos / weird ones
        "https://i.imgur.com/8Km9tLL.png",
        "https://cdn.phototourl.com/member/2026-11-09-3eeac61c-c554-48f8-872d-8e6f84fb79c9.png",
        "https://jinxxy-c.jinxxy-cdn.com/cdn-cgi/image/format=auto,onerror=redirect/5c2e8945-f61a-5377-87fa-750bcec247ee/3466294563277112810/759733571582708736.png",
        "https://art.ngfiles.com/thumbnails/2251000/2251437_full.webp?f1640175384",
        "https://upload.wikimedia.org/wikipedia/commons/7/79/Anteater_Anthro.jpg"
      ];

      function random(min, max) {
        return Math.random() * (max - min) + min;
      }

      function pick(arr) {
        return arr[Math.floor(Math.random() * arr.length)];
      }

      const animTypes = ['explodeOut', 'bounceAround', 'spinFall', 'zoomPop'];

      function spawnChaosImage(x, y) {
        const el = document.createElement('img');
        el.src = pick(chaosImages);
        el.className = 'chaos-img';

        const size = random(55, 190);
        el.style.width = size + 'px';

        if (typeof x === 'number' && x > 50) {
          el.style.left = (x + random(-60, 60)) + 'px';
          el.style.top  = (y + random(-60, 60)) + 'px';
        } else {
          el.style.left = random(3, 92) + 'vw';
          el.style.top  = random(3, 92) + 'vh';
        }

        const anim = pick(animTypes);
        const duration = random(1.3, 3.4);

        const angle = random(0, Math.PI * 2);
        const dist = random(260, 600);
        el.style.setProperty('--tx', Math.cos(angle) * dist + 'px');
        el.style.setProperty('--ty', Math.sin(angle) * dist + 'px');
        el.style.setProperty('--rot', random(-560, 560) + 'deg');

        el.style.setProperty('--tx1', random(-260, 260) + 'px');
        el.style.setProperty('--ty1', random(-260, 260) + 'px');
        el.style.setProperty('--tx2', random(-320, 320) + 'px');
        el.style.setProperty('--ty2', random(-320, 320) + 'px');
        el.style.setProperty('--tx3', random(-240, 240) + 'px');
        el.style.setProperty('--ty3', random(-240, 240) + 'px');
        el.style.setProperty('--tx4', random(-380, 380) + 'px');
        el.style.setProperty('--ty4', random(-380, 380) + 'px');

        el.style.animation = `${anim} ${duration}s ease-out forwards`;

        body.appendChild(el);
        setTimeout(() => el.remove(), duration * 1000 + 150);
      }

      function screenFlash() {
        const flash = document.createElement('div');
        flash.className = 'flash';
        const hue = random(0, 360);
        flash.style.background = `radial-gradient(circle at center, hsla(${hue}, 90%, 60%, 0.5), transparent 65%)`;
        body.appendChild(flash);
        setTimeout(() => flash.remove(), 600);
      }

      function shakeScreen() {
        body.classList.remove('shake');
        void body.offsetWidth;
        body.classList.add('shake');
        setTimeout(() => body.classList.remove('shake'), 500);
      }

      function createRipple(x, y) {
        const r = document.createElement('div');
        r.className = 'ripple';
        r.style.left = x + 'px';
        r.style.top = y + 'px';
        body.appendChild(r);
        setTimeout(() => r.remove(), 800);
      }

      let clickCount = 0;

      img.addEventListener('click', (e) => {
        clickCount++;

        const rect = img.getBoundingClientRect();
        const cx = rect.left + rect.width / 2;
        const cy = rect.top + rect.height / 2;

        createRipple(cx, cy);

        // bigger burst
        const burstCount = 10 + Math.min(clickCount * 3, 28);
        for (let i = 0; i < burstCount; i++) {
          setTimeout(() => {
            spawnChaosImage(cx, cy);
          }, i * 25);
        }

        // extra random ones
        const extra = Math.min(clickCount + 4, 18);
        for (let i = 0; i < extra; i++) {
          setTimeout(() => {
            spawnChaosImage();
          }, 80 + i * 35);
        }

        screenFlash();
        shakeScreen();

        img.style.transform = `scale(${random(0.65, 1.4)}) rotate(${random(-40, 40)}deg)`;
        setTimeout(() => {
          img.style.transform = '';
        }, 150);

        if (clickCount > 2) {
          for (let i = 0; i < 14; i++) {
            setTimeout(() => {
              spawnChaosImage();
              if (i % 2 === 0) screenFlash();
            }, 180 + i * 50);
          }
        }

        if (clickCount > 6) {
          // full chaos mode
          for (let i = 0; i < 35; i++) {
            setTimeout(() => spawnChaosImage(), i * 25);
          }
          shakeScreen();
        }
      });
    </script>
  </body>
</html>
