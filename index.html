<!DOCTYPE html>
<html>
  <head>
    <title>Fastyjay Spin</title>
    <style>
      body {
        margin: 0;
        height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        background: #111;
        overflow: hidden;
      }

      .spinner {
        font-size: 64px;
        font-weight: bold;
        color: #5C6AC4;
        animation: spin 3s linear infinite;
      }

      @keyframes spin {
        from {
          transform: rotate(0deg);
        }
        to {
          transform: rotate(360deg);
        }
      }
    </style>
  </head>
  <body>
    <div class="spinner">fastyjay</div>
  </body>
</html>
